<!-- Local vector illustration used in the hero area; the HTML supplies meaningful alt text. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-labelledby="title desc">
  <title id="title">Pixel Quest game controller</title>
  <desc id="desc">A stylized purple game controller with buttons and floating pixel shapes.</desc>
  <defs>
    <linearGradient id="bodyGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8e67ff"/>
      <stop offset="1" stop-color="#4c25bb"/>
    </linearGradient>
    <linearGradient id="gripGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#292244"/>
      <stop offset="1" stop-color="#151222"/>
    </linearGradient>
  </defs>
  <!-- Draw floating pixel decorations behind the controller. -->
  <g fill="#7d56e8" opacity=".75">
    <rect x="75" y="75" width="22" height="22" rx="4"/>
    <rect x="112" y="45" width="12" height="12" rx="2"/>
    <rect x="445" y="92" width="18" height="18" rx="3"/>
    <rect x="466" y="126" width="10" height="10" rx="2"/>
    <rect x="84" y="305" width="14" height="14" rx="2"/>
    <rect x="425" y="316" width="24" height="24" rx="4"/>
    <rect x="385" y="42" width="11" height="11" rx="2"/>
  </g>
  <!-- Draw the main controller shell and dark lower grips. -->
  <path d="M135 150 Q145 125 180 128 L380 128 Q415 125 425 150 L466 267 Q477 300 450 316 Q422 331 403 302 L372 261 L188 261 L157 302 Q138 331 110 316 Q83 300 94 267 Z" fill="url(#bodyGlow)" stroke="#24134f" stroke-width="8"/>
  <path d="M133 265 L160 307 Q175 326 194 305 L221 265 Z" fill="url(#gripGlow)"/>
  <path d="M339 265 L366 305 Q385 326 400 307 L427 265 Z" fill="url(#gripGlow)"/>
  <!-- Add the directional pad on the left side. -->
  <g fill="#171326" stroke="#b9a4ff" stroke-width="2">
    <rect x="155" y="174" width="28" height="82" rx="6"/>
    <rect x="128" y="201" width="82" height="28" rx="6"/>
  </g>
  <!-- Add the four action buttons on the right side. -->
  <g stroke="#27144f" stroke-width="3">
    <circle cx="385" cy="184" r="17" fill="#ff7aab"/>
    <circle cx="416" cy="215" r="17" fill="#7be5d5"/>
    <circle cx="354" cy="215" r="17" fill="#ffd166"/>
    <circle cx="385" cy="246" r="17" fill="#ffffff"/>
  </g>
  <!-- Add two small center buttons. -->
  <rect x="239" y="194" width="30" height="10" rx="5" fill="#d9ccff"/>
  <rect x="289" y="194" width="30" height="10" rx="5" fill="#d9ccff"/>
  <!-- Add small highlight marks to give the shell a glossy, game-like look. -->
  <path d="M183 145 Q205 137 224 143" fill="none" stroke="#d4c6ff" stroke-width="5" stroke-linecap="round" opacity=".8"/>
  <path d="M340 143 Q360 137 378 145" fill="none" stroke="#d4c6ff" stroke-width="5" stroke-linecap="round" opacity=".8"/>
</svg>
